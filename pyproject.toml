[project]
name = "emotiva-mc1-rs232"
version = "0.1.0"
description = "Home Assistant custom integration for Emotiva MC1 processor via RS232 serial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "homeassistant",
    "pyserial-asyncio-fast>=0.14",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
